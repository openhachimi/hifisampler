[package]
name = "hifi_server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP inference server and synthesis orchestrator (hifiserver)"

[[bin]]
name = "hifiserver"
path = "src/main.rs"

[dependencies]
axum = "0.7"
hifi_core = { path = "../hifi_core" }
hifi_dsp = { path = "../hifi_dsp" }
hifi_effects = { path = "../hifi_effects" }
hifi_lufs = { path = "../hifi_lufs" }
hifi_onnx = { path = "../hifi_onnx" }
ndarray.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
hifi_client = { path = "../hifi_client" }
tower = { version = "0.4", features = ["util"] }
