# OpenUtau Resampler Manifest for HifiSampler
# Copy this file alongside hifisampler.exe or hifisampler.sh in OpenUtau's Resamplers folder
# (matching the executable filename, e.g. hifisampler.yaml on Windows, or hifisampler.sh.yaml on Linux/macOS).
expressions:
  gen:
    name: gender
    abbr: gen
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: g
    skip_output_if_default: false
  Hb:
    name: breathiness (hifi)
    abbr: Hb
    type: Numerical
    min: 0
    max: 500
    default_value: 100
    is_flag: true
    flag: Hb
    skip_output_if_default: true
  Hv:
    name: voicing (hifi)
    abbr: Hv
    type: Numerical
    min: 0
    max: 150
    default_value: 100
    is_flag: true
    flag: Hv
    skip_output_if_default: true
  Ht:
    name: tension (hifi)
    abbr: Ht
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Ht
    skip_output_if_default: true
  HG:
    name: growl (hifi)
    abbr: HG
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: HG
    skip_output_if_default: true
  norm:
    name: normalize
    abbr: norm
    type: Numerical
    min: 0
    max: 100
    default_value: 86
    is_flag: true
    flag: P
    skip_output_if_default: false
  t:
    name: pitch shift (10 cents) (hifi)
    abbr: t
    type: Numerical
    min: -120
    max: 120
    default_value: 0
    is_flag: true
    flag: t
    skip_output_if_default: true
  A:
    name: amplitude modulation (hifi)
    abbr: A
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: A
    skip_output_if_default: true
  G:
    name: force regenerate cache (hifi)
    abbr: G
    type: Options
    min: 0
    max: 1
    default_value: 0
    is_flag: true
    flag: G
    options:
      - ""
      - G
    skip_output_if_default: true
  He:
    name: loop mode (hifi)
    abbr: He
    type: Options
    min: 0
    max: 1
    default_value: 0
    is_flag: true
    flag: He
    options:
      - ""
      - He
    skip_output_if_default: true
