# OpenUtau Resampler Manifest for HifiSampler
# Copy this file alongside hifisampler.exe or hifisampler.sh in OpenUtau's Resamplers folder
# (matching the executable filename, e.g. hifisampler.yaml or hifisampler.sh.yaml).
expressions:
  - name: gender
    abbr: gen
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: g
  - name: breathiness (hifi)
    abbr: Hb
    type: Numerical
    min: 0
    max: 500
    default_value: 100
    is_flag: true
    flag: Hb
  - name: voicing (hifi)
    abbr: Hv
    type: Numerical
    min: 0
    max: 150
    default_value: 100
    is_flag: true
    flag: Hv
  - name: tension (hifi)
    abbr: Ht
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Ht
  - name: growl (hifi)
    abbr: HG
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: HG
  - name: loudness norm (hifi)
    abbr: norm
    type: Numerical
    min: 0
    max: 100
    default_value: 100
    is_flag: true
    flag: P
  - name: pitch shift (10 cents) (hifi)
    abbr: t
    type: Numerical
    min: -120
    max: 120
    default_value: 0
    is_flag: true
    flag: t
  - name: amplitude modulation (hifi)
    abbr: A
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: A
  - name: force regenerate cache (hifi)
    abbr: G
    type: Options
    min: 0
    max: 1
    default_value: 0
    is_flag: true
    flag: G
    options:
      - ""
      - "G"
  - name: loop mode (hifi)
    abbr: He
    type: Options
    min: 0
    max: 1
    default_value: 0
    is_flag: true
    flag: He
    options:
      - ""
      - "He"
