name: Build and Upload Melos Release Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Melos release tag (even minor version, e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
      models_tag:
        description: 'Release tag containing pre-packaged melos-*-win64-dml.zip ONNX weights'
        required: true
        default: 'v0.2.0'
      platforms:
        description: 'Targets to build (all, unix, or comma-separated ids: win64,macos-arm64,macos-x64,linux-x64,linux-arm64)'
        required: true
        default: 'all'

permissions:
  contents: write

jobs:
  select-matrix:
    name: Select Target Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          PLATFORMS_INPUT: ${{ inputs.platforms }}
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          all_targets = [
              {"id": "win64", "runner": "windows-latest", "pkg_platform": "win64-dml", "ort_pkg": "onnxruntime-directml==1.24.4"},
              {"id": "macos-arm64", "runner": "macos-15", "pkg_platform": "macos-arm64-coreml", "ort_pkg": "onnxruntime==1.24.4"},
              {"id": "macos-x64", "runner": "macos-15-intel", "pkg_platform": "macos-x64-coreml", "ort_pkg": "onnxruntime==1.23.2"},
              {"id": "linux-x64", "runner": "ubuntu-latest", "pkg_platform": "linux-x64-aio", "ort_pkg": "onnxruntime==1.24.4"},
              {"id": "linux-arm64", "runner": "ubuntu-24.04-arm", "pkg_platform": "linux-arm64-aio", "ort_pkg": "onnxruntime==1.24.4"},
          ]
          sel = os.environ.get("PLATFORMS_INPUT", "all").strip().lower()
          if not sel or sel == "all":
              chosen = all_targets
          elif sel == "unix":
              chosen = [m for m in all_targets if m["id"] != "win64"]
          else:
              wanted = {x.strip() for x in sel.split(",") if x.strip()}
              chosen = [m for m in all_targets if m["id"] in wanted]
          if not chosen:
              raise SystemExit(f"No platforms matched PLATFORMS_INPUT={sel!r}")
          print("matrix=" + json.dumps({"include": chosen}))
          PY

  package-melos:
    name: Build & Package Melos (${{ matrix.id }})
    needs: select-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-matrix.outputs.matrix) }}

    steps:
      - name: Checkout melos branch / tag
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv and Python 3.12 (for ONNX Runtime shared libs & packager)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Setup packaging venv (.venv) with ONNX Runtime (${{ matrix.ort_pkg }})
        shell: bash
        run: |
          set -e
          uv venv .venv --clear --python 3.12
          uv pip install --python .venv "${{ matrix.ort_pkg }}"

      - name: Download ONNX model weights from ${{ inputs.models_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh release download "${{ inputs.models_tag }}" -p "melos-*-win64-dml.zip" -O models_bundle.zip --clobber
          if [ -x ".venv/Scripts/python.exe" ]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          "$PY" - <<'PY'
          import pathlib, shutil, zipfile
          dst = pathlib.Path(".")
          with zipfile.ZipFile("models_bundle.zip") as zf:
              for m in zf.infolist():
                  if m.is_dir():
                      continue
                  for prefix in ("melos/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/", "melos/hnsep/vr/"):
                      if m.filename.startswith(prefix):
                          rel = m.filename[len("melos/"):]
                          out = dst / rel
                          out.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(m) as src, out.open("wb") as f:
                              shutil.copyfileobj(src, f)
          PY
          rm -f models_bundle.zip

      - name: Build Melos Rust release binaries and run unit/integration tests
        shell: bash
        working-directory: ./rust
        run: |
          set -e
          cargo test --workspace --release
          cargo build --release -p hifi_server -p hifi_client

      - name: Package Melos archives and run 3-stage isolated smoke test (${{ matrix.pkg_platform }})
        shell: bash
        run: |
          set -e
          if [ -x ".venv/Scripts/python.exe" ]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          ORT_DIR="$("$PY" -c "import pathlib, onnxruntime; print(pathlib.Path(onnxruntime.__file__).resolve().parent)")"
          "$PY" ./scripts/package_melos_release.py \
            --version "${{ inputs.tag }}" \
            --platform "${{ matrix.pkg_platform }}" \
            --ort-dir "$ORT_DIR" \
            --models-root "$PWD" \
            --out-dir "$PWD/dist"

      - name: Upload Melos release assets to ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh release upload "${{ inputs.tag }}" dist/melos-* --clobber
