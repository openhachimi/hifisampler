name: Build and Upload Melos Release Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Melos release tag (even minor version, e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
      models_tag:
        description: 'Release tag containing upstream models.7z'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  package-melos-win64:
    name: Build & Package Melos (Windows x64 DirectML)
    runs-on: windows-latest

    steps:
      - name: Checkout melos branch / tag
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv and Python 3.12 (for HN-SEP ONNX export & DirectML ORT DLLs)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Setup packaging venv with CPU PyTorch and onnxruntime-directml
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          uv venv .pkg_venv --python 3.12
          uv pip install --python .pkg_venv "torch>=2.6.0" --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .pkg_venv onnx onnxruntime-directml pyyaml

      - name: Download models.7z and prepare ONNX weights
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh release download "${{ inputs.models_tag }}" -p "models.7z" --clobber
          7z x "models.7z" -o"_models_extract" -y | Out-Null

          $onnxFile = Get-ChildItem "_models_extract" -Recurse -Filter "model.onnx" | Select-Object -First 1
          if (-not $onnxFile) { throw "model.onnx not found in models.7z" }
          $vocoderDst = Join-Path $PWD "pc_nsf_hifigan_44.1k_hop512_128bin_2025.02"
          New-Item -ItemType Directory -Force -Path $vocoderDst | Out-Null
          Copy-Item -Recurse -Force "$($onnxFile.Directory.FullName)\*" $vocoderDst

          $ptFile = Get-ChildItem "_models_extract" -Recurse -Filter "model.pt" | Select-Object -First 1
          if (-not $ptFile) { throw "model.pt not found in models.7z" }
          $vrDst = Join-Path $PWD "hnsep\vr"
          New-Item -ItemType Directory -Force -Path $vrDst | Out-Null
          Copy-Item -Recurse -Force "$($ptFile.Directory.FullName)\*" $vrDst

          & .\.pkg_venv\Scripts\python.exe .\hnsep\convert_hnsep_to_onnx.py --ckpt "$vrDst\model.pt" --config "$vrDst\config.yaml" --out "$vrDst\model.onnx"
          if ($LASTEXITCODE -ne 0) { throw "HN-SEP ONNX export failed" }
          Remove-Item -Recurse -Force "_models_extract", "models.7z"

      - name: Build Melos Rust release binaries and run unit tests
        shell: pwsh
        working-directory: ./rust
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --workspace --release
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          cargo build --release --bins
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }

      - name: Package Melos archives and run 3-stage isolated smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\.pkg_venv\Scripts\python.exe .\scripts\package_melos_release.py `
            --version "${{ inputs.tag }}" `
            --ort-dir "$PWD\.pkg_venv\Lib\site-packages\onnxruntime" `
            --models-root "$PWD" `
            --out-dir "$PWD\dist"
          if ($LASTEXITCODE -ne 0) { throw "Melos packaging or smoke test failed" }

      - name: Upload Melos release assets to ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ inputs.tag }}"
          gh release upload $tag `
            "dist\melos-$tag-win64-dml.zip" `
            "dist\melos-$tag-win64-bins-only.zip" `
            "rust\melos.yaml" `
            --clobber
