[project]
name = "hifisampler"
version = "0.0.6"
description = "A new UTAU resampler based on pc-nsf-hifigan and straycatresampler for virtual singer."
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "librosa>=0.10.2.post1",
    "numpy>=2.1.3",
    "onnxruntime-directml>=1.22.0; sys_platform == 'win32'",
    "onnxruntime>=1.22.0; sys_platform != 'win32'",
    "praat-parselmouth>=0.4.5",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0.2",
    "resampy>=0.4.3",
    "ruamel-yaml>=0.18.10",
    "scipy>=1.15.2",
    "soundfile>=0.13.1",
    "torch>=2.13.0",
]

[tool.uv.sources]
# Default uses CUDA 12.9 wheels on Windows/Linux.
# For AMD ROCm on Linux, install torch from the pytorch-rocm index:
#   uv pip install --index-url https://download.pytorch.org/whl/rocm6.3 torch
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
